name: Android CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android 17 Build
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "37"
      ANDROID_BUILD_TOOLS: "36.0.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          if sdkmanager --list \
              | grep -q "platforms;android-${ANDROID_API}"; then
            sdkmanager "platforms;android-${ANDROID_API}"
          else
            echo "::warning::Android API ${ANDROID_API} belum tersedia."
            echo "::warning::Compile SDK harus disesuaikan dengan SDK yang tersedia."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: false

      - name: Verify Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "::error::Gradle Wrapper tidak ditemukan."
            echo "Commit gradlew dan gradle/wrapper ke repository."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --version

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
