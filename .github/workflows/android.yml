name: Android CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew
          test -d app
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/febri/liquidglass/ui/MainActivity.kt
          test -f app/src/main/java/com/febri/liquidglass/ui/LiquidGlassCompose.kt
          chmod +x gradlew

      - name: Check duplicate Android resource IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          ids = {}
          duplicates = []
          for path in pathlib.Path("app/src/main/res").rglob("*.xml"):
              text = path.read_text(encoding="utf-8", errors="ignore")
              for match in re.finditer(r'android:id="@\+id/([A-Za-z0-9_]+)"', text):
                  item = match.group(1)
                  ids.setdefault(item, []).append(str(path))
          for item, paths in ids.items():
              if len(paths) > 1:
                  duplicates.append((item, paths))
          if duplicates:
              print("Duplicate resource IDs found:")
              for item, paths in duplicates:
                  print(item, paths)
              sys.exit(1)
          print("No duplicate resource IDs found.")

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Lint debug
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLiquidGlass-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppLiquidGlass-android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
