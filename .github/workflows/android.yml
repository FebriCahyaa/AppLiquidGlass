name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Detect Android platform
        id: android-platform
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking available Android SDK platforms..."

          SDK_LIST="$(sdkmanager --list --channel=3 2>/dev/null || true)"

          PLATFORM_PACKAGE="$(
            printf '%s\n' "$SDK_LIST" |
              grep -oE 'platforms;android-37(\.0)?' |
              sort -u |
              head -n 1
          )"

          if [ -n "$PLATFORM_PACKAGE" ]; then
            echo "platform=$PLATFORM_PACKAGE" >> "$GITHUB_OUTPUT"
            echo "api=37" >> "$GITHUB_OUTPUT"
            echo "compile_api=37" >> "$GITHUB_OUTPUT"
            echo "Android API 37 detected: $PLATFORM_PACKAGE"
          else
            echo "::warning::Android API 37 is unavailable on this runner."
            echo "::warning::Using stable Android API 36 fallback."

            echo "platform=platforms;android-36" >> "$GITHUB_OUTPUT"
            echo "api=36" >> "$GITHUB_OUTPUT"
            echo "compile_api=36" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Android SDK packages
        shell: bash
        env:
          PLATFORM_PACKAGE: ${{ steps.android-platform.outputs.platform }}
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "${PLATFORM_PACKAGE}"

      - name: Verify Android SDK
        shell: bash
        env:
          PLATFORM_PACKAGE: ${{ steps.android-platform.outputs.platform }}
        run: |
          set -euo pipefail

          sdkmanager --list >/dev/null

          if [ ! -d "${ANDROID_HOME}/${PLATFORM_PACKAGE}" ]; then
            echo "::error::Required Android platform was not installed: ${PLATFORM_PACKAGE}"
            exit 1
          fi

          echo "Installed platform: ${PLATFORM_PACKAGE}"

      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "::error::gradlew tidak ditemukan."
            echo "::error::Tambahkan Gradle Wrapper ke repository."
            exit 1
          fi

      - name: Validate Gradle
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew lintDebug --stacktrace

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppLiquidGlass-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
