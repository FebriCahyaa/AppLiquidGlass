name: Flutter CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart files
        working-directory: flutter
        run: dart format lib

      - name: Check Dart formatting
        working-directory: flutter
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: flutter
        shell: bash
        run: |
          if [ -d "test" ]; then
           flutter test --no-pub
          else
            echo "No Flutter test directory found; skipping tests."
          fi
          
      - name: Build debug APK
        working-directory: flutter
        shell: bash
        run: |
          if [ -f "android/app/build.gradle" ] || [ -f "android/app/build.gradle.kts" ]; then
           flutter build apk --debug --no-pub
          else
            echo "No Android Gradle project found in flutter/android; skipping Flutter APK build."
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-liquid-glass-flutter-debug
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
